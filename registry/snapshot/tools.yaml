schemaVersion: fw.buildy.tech/registry/v0alpha1
kind: Registry
metadata:
  id: fw-tool-records
  status: draft
records:
  - id: ui8kit-codegen
    kind: generator
    version: "0.0.0-draft"
    readiness: draft
    source:
      kind: npm
      package: "@ui8kit/codegen"
      ref: "0.1.0"
    command:
      argv: ["npx", "@ui8kit/codegen", "generate", "--runtime", "${runtime}"]
      phase: generate
      exit: "zero-on-success"
    notes: Runtime is taken from the selected ui adapter. fwyml must not branch on templ, svelte, or solid by name.
  - id: ui8px
    kind: validator
    version: "0.2.4"
    readiness: draft
    source:
      kind: npm
      package: ui8px
      ref: "0.2.4"
      install: devDependency
    command:
      argv: ["npx", "ui8px", "validate", "patterns", ".ui8px/scan"]
      prepare: ["node", "scripts/ui8px-prepare.mjs"]
      inputs: [".ui8px/policy", ".ui8px/scan"]
      exit: "zero-on-success"
  - id: retag
    kind: validator
    version: "0.0.0-draft"
    readiness: draft
    source:
      kind: npm
      package: "@ui8kit/retag"
      ref: "0.0.0-draft"
    command:
      argv: ["npx", "@ui8kit/retag", "validate"]
      exit: "zero-on-success"
    notes: Rule packs are guidance records. FW and fwyml do not reimplement checks.
  - id: wails
    kind: validator
    version: "3"
    readiness: draft
    source:
      kind: none
    command:
      argv: ["wails3", "task", "build"]
      prepare: ["wails3", "generate", "bindings"]
      phase: pack
      exit: "zero-on-success"
  - id: templ-generate
    kind: validator
    version: "0.0.0-draft"
    readiness: draft
    command:
      argv: ["templ", "generate"]
      phase: generate
      exit: "zero-on-success"
  - id: svelte-check
    kind: validator
    version: "0.0.0-draft"
    readiness: draft
    command:
      argv: ["npx", "svelte-check"]
      exit: "zero-on-success"
  - id: typescript-check
    kind: validator
    version: "0.0.0-draft"
    readiness: draft
    command:
      argv: ["npx", "tsc", "--noEmit"]
      exit: "zero-on-success"
  - id: go-test
    kind: validator
    version: "0.0.0-draft"
    readiness: draft
    command:
      argv: ["go", "test", "./..."]
      exit: "zero-on-success"
  - id: go-vet
    kind: validator
    version: "0.0.0-draft"
    readiness: draft
    command:
      argv: ["go", "vet", "./..."]
      exit: "zero-on-success"
  - id: aria
    kind: validator
    version: "0.0.0-draft"
    readiness: draft
    command:
      argv: ["npx", "ui8px", "validate", "aria"]
      exit: "zero-on-success"
  - id: locale
    kind: validator
    version: "0.0.0-draft"
    readiness: draft
    command:
      argv: ["node", "scripts/validate-locale.mjs"]
      exit: "zero-on-success"
  - id: wails-bindings
    kind: validator
    version: "3"
    readiness: draft
    command:
      argv: ["wails3", "generate", "bindings", "-ts"]
      phase: generate
      outputs: ["frontend/bindings"]
      exit: "zero-on-success"
  - id: wails-build
    kind: validator
    version: "3"
    readiness: draft
    command:
      argv: ["wails3", "task", "build"]
      phase: pack
      exit: "zero-on-success"
