schemaVersion: fw.buildy.tech/registry/v0alpha1
kind: Registry
metadata:
  id: vsa-draft-records
  status: draft
records:
  - id: host
    kind: capability
    version: "0"
    contract: host@0
    readiness: draft
    conformanceRefs: [host-lifecycle]
  - id: ui
    kind: capability
    version: "0"
    contract: ui@0
    readiness: draft
    conformanceRefs: [selected-ui-runtime]
  - id: workspace
    kind: capability
    version: "0"
    contract: workspace@0
    readiness: draft
    conformanceRefs: [workspace-revision-write]
  - id: editor
    kind: capability
    version: "0"
    contract: editor@0
    readiness: draft
    conformanceRefs: [editor-document-lifetime]
  - id: explorer
    kind: capability
    version: "0"
    contract: explorer@0
    readiness: draft
    conformanceRefs: [explorer-open-intent]
  - id: vcs
    kind: capability
    version: "0"
    contract: vcs@0
    readiness: draft
    conformanceRefs: [vcs-status-and-failures]
  - id: agent
    kind: capability
    version: "0"
    contract: agent@0
    readiness: draft
    conformanceRefs: [agent-event-stream]
  - id: browse
    kind: capability
    version: "0"
    contract: browse@0
    readiness: draft
    conformanceRefs: [browse-session-dispose]
  - id: delivery
    kind: capability
    version: "0"
    contract: delivery@0
    readiness: draft
    conformanceRefs: [portable-delivery]
  - id: languages
    kind: capability
    version: "0"
    contract: languages@0
    readiness: draft
  - id: terminal
    kind: capability
    version: "0"
    contract: terminal@0
    readiness: draft
  - id: templ
    kind: capability
    version: "0"
    contract: ui@0
    readiness: draft
  - id: svelte
    kind: capability
    version: "0"
    contract: ui@0
    readiness: draft
  - id: solid-js
    kind: capability
    version: "0"
    contract: ui@0
    readiness: draft

  - id: host-wails3-go
    kind: adapter
    version: 0.0.0-draft
    contract: host@0
    provides: [host]
    dependencies: [product-template-desktop]
    readiness: draft
    source:
      kind: local
      path: ../artifacts/host-wails3-go
      repository: https://github.com/buildy-ui/ide.git
      commit: fda6faf8d6493aa1bd82d4083b1de8a565da32a3
      portable: false
    integrity:
      publicDigest: sha256:draft-host
      outputDigest: sha256:draft-host-out
    ownedFiles:
      - host/surface.txt
      - compose/host.go
    go:
      module: github.com/wailsapp/wails/v3
      require: v3.0.0-beta.19
    compatibility:
      platforms: [windows]
      runtimes: [go]
    conformanceRefs: [host-lifecycle]

  - id: delivery-portable-windows
    kind: delivery
    version: 0.0.0-draft
    contract: delivery@0
    provides: [delivery]
    readiness: draft
    source:
      kind: local
      path: ../artifacts/delivery-portable-windows
      repository: https://github.com/buildy-ui/ide.git
      commit: fda6faf8d6493aa1bd82d4083b1de8a565da32a3
      portable: false
    ownedFiles:
      - delivery/layout.txt
      - compose/delivery.go
      - internal/delivery/paths.go
      - internal/delivery/paths_test.go
    integrity:
      publicDigest: sha256:draft-delivery
    conformanceRefs: [portable-delivery]
    compatibility:
      platforms: [windows]

  - id: workspace-fs-go
    kind: adapter
    version: 0.0.0-draft
    contract: workspace@0
    provides: [workspace]
    readiness: draft
    source:
      kind: local
      path: ../artifacts/workspace-fs-go
      repository: https://github.com/buildy-ui/ide.git
      commit: fda6faf8d6493aa1bd82d4083b1de8a565da32a3
      portable: false
    ownedFiles:
      - workspace/surface.txt
      - compose/workspace.go
      - internal/workspace/root.go
      - internal/workspace/safe.go
      - internal/workspace/write.go
      - internal/workspace/workspace_test.go
    integrity:
      publicDigest: sha256:draft-workspace
    conformanceRefs: [workspace-revision-write]

  - id: explorer-workspace-tree
    kind: adapter
    version: 0.0.0-draft
    contract: explorer@0
    provides: [explorer]
    requires: [workspace]
    readiness: draft
    source:
      kind: local
      path: ../artifacts/explorer-workspace-tree
      repository: https://github.com/buildy-ui/ide.git
      commit: fda6faf8d6493aa1bd82d4083b1de8a565da32a3
      portable: false
    ownedFiles:
      - explorer/surface.txt
      - compose/explorer.go
    integrity:
      publicDigest: sha256:draft-explorer
    conformanceRefs: [explorer-open-intent]

  - id: vcs-git-cli
    kind: adapter
    version: 0.0.0-draft
    contract: vcs@0
    provides: [vcs]
    readiness: draft
    source:
      kind: local
      path: ../artifacts/vcs-git-cli
      repository: https://github.com/buildy-ui/ide.git
      commit: fda6faf8d6493aa1bd82d4083b1de8a565da32a3
      portable: false
    ownedFiles:
      - vcs/surface.txt
      - compose/vcs.go
    integrity:
      publicDigest: sha256:draft-vcs
    conformanceRefs: [vcs-status-and-failures]

  - id: ui-ui8kit-templ
    kind: adapter
    version: 0.0.0-draft
    contract: ui@0
    provides: [ui, templ]
    readiness: draft
    source:
      kind: generated
      path: ../artifacts/ui-ui8kit-templ
      portable: false
    compatibility:
      runtimes: [templ]
    ownedFiles:
      - ui/runtime.txt
      - frontend/dist/index.html
      - frontend/app.templ
    integrity:
      publicDigest: sha256:draft-ui-templ
    conformanceRefs: [selected-ui-runtime]
    dependencies: [ui8kit-codegen]

  - id: ui-ui8kit-svelte
    kind: adapter
    version: 0.0.0-draft
    contract: ui@0
    provides: [ui, svelte]
    readiness: draft
    source:
      kind: generated
      path: ../artifacts/ui-ui8kit-svelte
      portable: false
    compatibility:
      runtimes: [svelte]
    ownedFiles:
      - ui/runtime.txt
      - frontend/dist/index.html
      - frontend/src/App.svelte
    npm:
      dependencies:
        svelte: "5.0.0"
    integrity:
      publicDigest: sha256:draft-ui-svelte
    conformanceRefs: [selected-ui-runtime]
    dependencies: [ui8kit-codegen]

  - id: ui-ui8kit-solid
    kind: adapter
    version: 0.0.0-draft
    contract: ui@0
    provides: [ui, solid-js]
    readiness: draft
    source:
      kind: local
      path: ../artifacts/ui-ui8kit-solid
      repository: https://github.com/buildy-ui/ide.git
      commit: fda6faf8d6493aa1bd82d4083b1de8a565da32a3
      portable: false
    compatibility:
      runtimes: [solid]
    ownedFiles:
      - ui/runtime.txt
      - frontend/dist/index.html
      - frontend/src/App.solid.tsx
    npm:
      dependencies:
        solid-js: "1.9.0"
    integrity:
      publicDigest: sha256:draft-ui-solid
    conformanceRefs: [selected-ui-runtime]

  - id: editor-templ
    kind: adapter
    version: 0.0.0-draft
    contract: editor@0
    provides: [editor]
    readiness: draft
    source:
      kind: local
      path: ../artifacts/editor-templ
      portable: false
    ownedFiles:
      - editor/surface.txt
      - compose/editor.go
    notes: Limited textarea document adapter. Does not claim richer editor parity.
    integrity:
      publicDigest: sha256:draft-editor-templ
    conformanceRefs: [editor-document-lifetime]

  - id: editor-editory-svelte
    kind: adapter
    version: 0.0.0-draft
    contract: editor@0
    provides: [editor]
    readiness: draft
    source:
      kind: npm
      package: "@ui8kit/editory-svelte"
      path: ../artifacts/editor-editory-svelte
      portable: false
    ownedFiles:
      - editor/surface.txt
      - compose/editor.go
    npm:
      dependencies:
        "@ui8kit/editory-svelte": "0.0.0-draft"
    integrity:
      publicDigest: sha256:draft-editory
    conformanceRefs: [editor-document-lifetime]

  - id: browse-webview2-windows
    kind: adapter
    version: 0.0.0-draft
    contract: browse@0
    provides: [browse]
    readiness: draft
    conflicts: [webview2-browser]
    source:
      kind: local
      path: ../artifacts/browse-webview2-windows
      repository: https://github.com/buildy-ui/ide.git
      commit: fda6faf8d6493aa1bd82d4083b1de8a565da32a3
      portable: false
    ownedFiles:
      - browse/surface.txt
      - compose/browse.go
      - internal/browse/hub.go
      - internal/browse/hub_test.go
    integrity:
      publicDigest: sha256:draft-browse
    conformanceRefs: [browse-session-dispose]
    compatibility:
      platforms: [windows]

  - id: webview2-browser
    kind: capability
    version: "0"
    contract: browse@0
    readiness: draft
    notes: Alias used by product constraints for the native browser adapter family.

  - id: agent-event-contract
    kind: adapter
    version: 0.0.0-draft
    contract: agent@0
    readiness: draft
    source:
      kind: local
      path: ../artifacts/agent-event-contract
      repository: https://github.com/buildy-ui/ide.git
      commit: fda6faf8d6493aa1bd82d4083b1de8a565da32a3
      portable: false
    ownedFiles:
      - agent/contract.txt
      - .cursor/rules/agent.mdc
      - packages/agent-contract/index.ts
    integrity:
      publicDigest: sha256:draft-agent-contract

  - id: agent-runtime-cursor-node
    kind: adapter
    version: 0.0.0-draft
    contract: agent@0
    provides: [agent]
    readiness: blocked
    dependencies: [agent-event-contract]
    source:
      kind: local
      path: ../artifacts/agent-runtime-cursor-node
      repository: https://github.com/buildy-ui/ide.git
      commit: fda6faf8d6493aa1bd82d4083b1de8a565da32a3
      portable: false
    ownedFiles:
      - agent/runtime.txt
      - compose/agent.go
    notes: Event contract exists; the sidecar runtime is not extracted.
    integrity:
      publicDigest: sha256:draft-agent-runtime
    conformanceRefs: [agent-event-stream]

  - id: workshop-shell
    kind: vertical-slice
    version: 0.0.0-draft
    readiness: draft
    requires: [host, ui]
    surfaces: [application-shell]
    uiFamilies: [templ, svelte, solid]
    hostFamilies: [go]
    source:
      kind: files
      path: ../artifacts/workshop-shell
      portable: false
    ownedFiles:
      - slices/workshop-shell.txt
    removal:
      ownedFiles: [slices/workshop-shell.txt]
    integrity:
      publicDigest: sha256:draft-workshop-shell

  - id: editor-surface
    kind: vertical-slice
    version: 0.0.0-draft
    readiness: draft
    requires: [editor]
    surfaces: [editor]
    uiFamilies: [templ, svelte]
    source:
      kind: files
      path: ../artifacts/editor-surface
      portable: false
    ownedFiles:
      - slices/editor-surface.txt
    removal:
      ownedFiles: [slices/editor-surface.txt]
    integrity:
      publicDigest: sha256:draft-editor-surface

  - id: explorer-surface
    kind: vertical-slice
    version: 0.0.0-draft
    readiness: draft
    requires: [explorer]
    surfaces: [explorer]
    source:
      kind: files
      path: ../artifacts/explorer-surface
      portable: false
    ownedFiles:
      - slices/explorer-surface.txt
    removal:
      ownedFiles: [slices/explorer-surface.txt]
    integrity:
      publicDigest: sha256:draft-explorer-surface

  - id: browser-surface
    kind: vertical-slice
    version: 0.0.0-draft
    readiness: draft
    requires: [browse]
    surfaces: [browse]
    source:
      kind: files
      path: ../artifacts/browser-surface
      portable: false
    ownedFiles:
      - slices/browser-surface.txt
    removal:
      ownedFiles: [slices/browser-surface.txt]
    integrity:
      publicDigest: sha256:draft-browser-surface

  - id: agent-chat-surface
    kind: vertical-slice
    version: 0.0.0-draft
    readiness: draft
    requires: [agent]
    surfaces: [agent-chat]
    uiFamilies: [svelte, solid]
    source:
      kind: files
      path: ../artifacts/agent-chat-surface
      portable: false
    ownedFiles:
      - slices/agent-chat-surface.txt
    removal:
      ownedFiles: [slices/agent-chat-surface.txt]
    integrity:
      publicDigest: sha256:draft-agent-chat

  - id: product-template-desktop
    kind: product-template
    version: 0.0.0-draft
    readiness: draft
    source:
      kind: files
      path: ../artifacts/product-template-desktop
      portable: false
    ownedFiles:
      - main.go
      - Taskfile.yml
      - compose/register.go
      - compose/register_test.go
      - go.mod
      - go.sum
    go:
      module: example.com/app
    integrity:
      publicDigest: sha256:draft-template

  - id: wails3-go
    kind: guidance
    version: 0.0.0-draft
    readiness: draft
    source:
      kind: files
      path: ../artifacts/guidance-wails3-go
    ownedFiles:
      - .cursor/rules/host.mdc
  - id: ui8kit-templ
    kind: guidance
    version: 0.0.0-draft
    readiness: draft
    source:
      kind: files
      path: ../artifacts/guidance-ui8kit-templ
    ownedFiles:
      - .cursor/rules/ui-templ.mdc
  - id: ui8kit-svelte
    kind: guidance
    version: 0.0.0-draft
    readiness: draft
    source:
      kind: files
      path: ../artifacts/guidance-ui8kit-svelte
    ownedFiles:
      - .cursor/rules/ui-svelte.mdc
  - id: ui8kit-solid
    kind: guidance
    version: 0.0.0-draft
    readiness: draft
    source:
      kind: files
      path: ../artifacts/guidance-ui8kit-solid
    ownedFiles:
      - .cursor/rules/ui-solid.mdc
  - id: svelte5-dx
    kind: guidance
    version: 0.0.0-draft
    readiness: draft
    source:
      kind: files
      path: ../artifacts/guidance-svelte5-dx
    ownedFiles:
      - .cursor/rules/svelte-dx.mdc
  - id: solid-dx
    kind: guidance
    version: 0.0.0-draft
    readiness: draft
    source:
      kind: files
      path: ../artifacts/guidance-solid-dx
    ownedFiles:
      - .cursor/rules/solid-dx.mdc
  - id: editory-svelte
    kind: guidance
    version: 0.0.0-draft
    readiness: draft
    source:
      kind: files
      path: ../artifacts/guidance-editory-svelte
    ownedFiles:
      - .cursor/rules/editor.mdc
  - id: accessibility
    kind: guidance
    version: 0.0.0-draft
    readiness: draft
    source:
      kind: files
      path: ../artifacts/guidance-accessibility
    ownedFiles:
      - .cursor/rules/aria.mdc
  - id: browser-webview2
    kind: guidance
    version: 0.0.0-draft
    readiness: draft
    source:
      kind: files
      path: ../artifacts/guidance-browser-webview2
    ownedFiles:
      - .cursor/rules/browse.mdc