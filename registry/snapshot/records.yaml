    source:
      kind: files
      path: ../artifacts/editor-surface-templ
      portable: false
    ownedFiles:
      - slices/editor-surface-templ.txt
      - views/editor.templ
    removal:
      ownedFiles:
        - slices/editor-surface-templ.txt
        - views/editor.templ
    integrity:
      publicDigest: sha256:draft-editor-surface-templ
  - id: editor-surface-svelte
    kind: vertical-slice
    version: 0.0.0-draft
    readiness: draft
    requires:
      - editor
    surfaces:
      - editor
    uiFamilies:
      - svelte
    source:
      kind: files
      path: ../artifacts/editor-surface-svelte
