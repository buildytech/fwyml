schemaVersion: fw.buildy.tech/registry/v0alpha1
kind: Registry
metadata:
  id: vsa-draft-records
  status: draft
records:
  - id: host
    kind: capability
    version: "0"
    contract: host@0
    readiness: draft
    conformanceRefs:
      - host-lifecycle
  - id: desktop-presentation
    kind: capability
    version: "0"
    contract: desktop-presentation@0
    readiness: draft
    conformanceRefs:
      - desktop-presentation-boundary
  - id: ui
    kind: capability
    version: "0"
    contract: ui@0
    readiness: draft
    conformanceRefs:
      - selected-ui-runtime
  - id: workspace
    kind: capability
    version: "0"
    contract: workspace@0
    readiness: draft
    conformanceRefs:
      - workspace-revision-write
  - id: userstore
    kind: capability
    version: "0"
    contract: userstore@0
    readiness: draft
    conformanceRefs:
      - userstore-session-lifetime
  - id: editor
    kind: capability
    version: "0"
    contract: editor@0
    readiness: draft
    conformanceRefs:
      - editor-document-lifetime
  - id: explorer
    kind: capability
    version: "0"
    contract: explorer@0
    readiness: draft
    conformanceRefs:
      - explorer-open-intent
  - id: vcs
    kind: capability
    version: "0"
    contract: vcs@0
    readiness: draft
    conformanceRefs:
      - vcs-status-and-failures
  - id: agent
    kind: capability
    version: "0"
    contract: agent@0
    readiness: draft
    conformanceRefs:
      - agent-event-stream
  - id: browse
    kind: capability
    version: "0"
    contract: browse@0
    readiness: draft
    conformanceRefs:
      - browse-session-dispose
  - id: delivery
    kind: capability
    version: "0"
    contract: delivery@0
    readiness: draft
    conformanceRefs:
      - portable-delivery
  - id: languages
    kind: capability
    version: "0"
    contract: languages@0
    readiness: draft
    conformanceRefs:
      - language-document-operations
  - id: terminal
    kind: capability
    version: "0"
    contract: terminal@0
    readiness: draft
    conformanceRefs:
      - terminal-session-lifecycle
  - id: templ
    kind: capability
    version: "0"
    contract: ui@0
    readiness: draft
  - id: svelte
    kind: capability
    version: "0"
    contract: ui@0
    readiness: draft
  - id: solid-js
    kind: capability
    version: "0"
    contract: ui@0
    readiness: draft
  - id: desktop-presentation-go
    kind: adapter
    version: 0.0.0-draft
    contract: desktop-presentation@0
    provides:
      - desktop-presentation
    requires:
      - workspace
      - userstore
      - terminal
      - vcs
      - languages
    dependencies:
      - tasks-discover-go
      - process-go
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/desktop
      module: github.com/fastygo/modules/desktop
      portable: true
    go:
      module: github.com/fastygo/modules/desktop
      require: v0.0.0
      replace: local
    notes: Staged from ide/.modules/desktop. Transport-neutral BFF. No owned compose files.
    conformanceRefs:
      - desktop-presentation-boundary
  - id: host-wails3-go
    kind: adapter
    version: 0.0.0-draft
    contract: host@0
    provides:
      - host
    features:
      - wails3
    requires:
      - desktop-presentation
    dependencies:
      - desktop-presentation-go
    readiness: draft
    notes: Wails adapter of desktop.Host. Staged in ide/.modules/wails. No artifact file copies.
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/wails
      module: github.com/fastygo/modules/wails
      portable: true
    go:
      module: github.com/fastygo/modules/wails
      require: v0.0.0
      replace: local
    compatibility:
      platforms:
        - windows
      runtimes:
        - go
    conformanceRefs:
      - host-lifecycle
  - id: delivery-portable-windows
    kind: delivery
    version: 0.0.0-draft
    contract: delivery@0
    provides:
      - delivery
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/portable
      module: github.com/fastygo/modules/portable
      portable: true
    go:
      module: github.com/fastygo/modules/portable
      require: v0.0.0
      replace: local
    notes: Staged from ide/.modules/portable. No owned path files.
    conformanceRefs:
      - portable-delivery
    compatibility:
      platforms:
        - windows
  - id: process-go
    kind: adapter
    version: 0.0.0-draft
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/process
      module: github.com/fastygo/modules/process
      portable: true
    go:
      module: github.com/fastygo/modules/process
      require: v0.0.0
      replace: local
    notes: Shared spawn helpers. Not a port.
  - id: tasks-discover-go
    kind: adapter
    version: 0.0.0-draft
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/tasks
      module: github.com/fastygo/modules/tasks
      portable: true
    go:
      module: github.com/fastygo/modules/tasks
      require: v0.0.0
      replace: local
    notes: package.json scripts and go.mod commands. Not a port.
  - id: workspace-fs-go
    kind: adapter
    version: 0.0.0-draft
    contract: workspace@0
    provides:
      - workspace
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/workspace
      module: github.com/fastygo/modules/workspace
      portable: true
    go:
      module: github.com/fastygo/modules/workspace
      require: v0.0.0
      replace: local
    notes: Staged from ide/.modules/workspace. Product imports the module. No file copy.
    conformanceRefs:
      - workspace-revision-write
  - id: explorer-workspace-tree
    kind: adapter
    version: 0.0.0-draft
    contract: explorer@0
    provides:
      - explorer
    requires:
      - workspace
    readiness: draft
    source:
      kind: none
    notes: Explorer UI is a ui8kit widget. Workspace.ListTree stays in the workspace module. No compose file copy.
    integrity:
      publicDigest: sha256:draft-explorer
    conformanceRefs:
      - explorer-open-intent
  - id: vcs-git-cli
    kind: adapter
    version: 0.0.0-draft
    contract: vcs@0
    provides:
      - vcs
    requires:
      - workspace
    dependencies:
      - process-go
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/vcs
      module: github.com/fastygo/modules/vcs
      portable: true
    go:
      module: github.com/fastygo/modules/vcs
      require: v0.0.0
      replace: local
    notes: Staged from ide/.modules/vcs. No owned git CLI files.
    conformanceRefs:
      - vcs-status-and-failures
  - id: ui-ui8kit-templ
    kind: adapter
    version: 0.0.0-draft
    contract: ui@0
    provides:
      - ui
      - templ
    readiness: draft
    source:
      kind: generated
      path: ../artifacts/ui-ui8kit-templ
      portable: false
    compatibility:
      runtimes:
        - templ
    ownedFiles:
      - ui/runtime.txt
      - frontend/dist/index.html
      - frontend/app.templ
    integrity:
      publicDigest: sha256:draft-ui-templ
    conformanceRefs:
      - selected-ui-runtime
    dependencies:
      - ui8kit-codegen
  - id: ui-ui8kit-svelte
    kind: adapter
    version: 0.0.0-draft
    contract: ui@0
    provides:
      - ui
      - svelte
    features:
      - svelte5
    readiness: draft
    source:
      kind: local
      path: ../artifacts/ui-ui8kit-svelte
      portable: false
    compatibility:
      runtimes:
        - svelte
    ownedFiles:
      - ui/runtime.txt
      - index.html
      - vite.config.ts
      - svelte.config.js
      - tsconfig.json
      - src/main.ts
      - src/app.css
      - packages/ui8kit-svelte/generated/ui/badge/Badge.svelte
      - packages/ui8kit-svelte/generated/ui/badge/badge.shared.ts
      - packages/ui8kit-svelte/generated/ui/badge/badge.variants.json
      - packages/ui8kit-svelte/generated/ui/button/Button.svelte
      - packages/ui8kit-svelte/generated/ui/button/button.shared.ts
      - packages/ui8kit-svelte/generated/ui/button/button.variants.json
      - packages/ui8kit-svelte/generated/ui/index.svelte.ts
      - packages/ui8kit-svelte/generated/ui/separator/Separator.svelte
      - packages/ui8kit-svelte/generated/ui/separator/separator.shared.ts
      - packages/ui8kit-svelte/generated/ui/separator/separator.variants.json
      - packages/ui8kit-svelte/generated/ui/text/Text.svelte
      - packages/ui8kit-svelte/generated/ui/text/text.shared.ts
      - packages/ui8kit-svelte/generated/ui/text/text.variants.json
      - packages/ui8kit-svelte/generated/utils/cn.ts
      - packages/ui8kit-svelte/generated/utils/env.ts
      - packages/ui8kit-svelte/generated/utils/expr.ts
      - packages/ui8kit-svelte/generated/utils/index.ts
      - packages/ui8kit-svelte/generated/utils/recipe-types.ts
      - packages/ui8kit-svelte/generated/utils/tags.ts
      - packages/ui8kit-svelte/generated/utils/variants.ts
    npm:
      dependencies:
        svelte: 5.19.10
        "@wailsio/runtime": 3.0.0-beta.19
        clsx: 2.1.1
        tailwind-merge: 2.6.0
      devDependencies:
        vite: 6.3.1
        "@sveltejs/vite-plugin-svelte": 5.0.3
        typescript: 5.7.3
      scripts:
        dev: vite
        build: vite build
    notes: Vite+Svelte5 shell with owned UI8Kit codegen Svelte brick subset under packages/ui8kit-svelte/generated. npm @ui8kit/codegen is 404 — bricks are vendored locally.
    integrity:
      publicDigest: sha256:draft-ui-svelte
    conformanceRefs:
      - selected-ui-runtime
    dependencies:
      - ui8kit-codegen
  - id: ui-ui8kit-solid
    kind: adapter
    version: 0.0.0-draft
    contract: ui@0
    provides:
      - ui
      - solid-js
    readiness: draft
    source:
      kind: npm
      package: "@ui8kit/registry"
      ref: 2.0.0
    compatibility:
      runtimes:
        - solid
    npm:
      dependencies:
        solid-js: 1.9.0
        "@wailsio/runtime": 3.0.0-beta.19
        codemirror: ^6.0.2
        "@codemirror/autocomplete": 6.20.3
        "@codemirror/lang-css": ^6.3.1
        "@codemirror/lang-html": ^6.4.9
        "@codemirror/lang-javascript": ^6.2.4
        "@codemirror/lang-json": ^6.0.2
        "@codemirror/lang-markdown": ^6.3.3
        "@codemirror/lang-python": ^6.2.1
        "@codemirror/lang-yaml": ^6.1.2
        "@codemirror/language": ^6.11.3
        "@codemirror/lint": 6.9.7
        "@codemirror/search": ^6.7.2
        "@codemirror/state": ^6.5.2
        "@codemirror/view": ^6.38.1
        "@lezer/highlight": ^1.2.3
        clsx: ^2.1.1
        tailwind-merge: ^3.6.0
        "@codemirror/lang-go": ^6.0.1
      devDependencies:
        vite: 6.3.1
        vite-plugin-solid: 2.11.6
        typescript: 5.7.3
        tailwindcss: 4.1.11
        "@tailwindcss/vite": 4.1.11
      scripts:
        dev: vite
        build: vite build
    notes: Bricks install via ui8kit add from @ui8kit/registry. Not a fwyml file warehouse.
    integrity:
      publicDigest: sha256:draft-ui-solid
    conformanceRefs:
      - selected-ui-runtime
  - id: editor-templ
    kind: adapter
    version: 0.0.0-draft
    contract: editor@0
    provides:
      - editor
    readiness: draft
    source:
      kind: local
      path: ../artifacts/editor-templ
      portable: false
    ownedFiles:
      - editor/surface.txt
      - compose/editor.go
    notes: Limited textarea document adapter. Does not claim richer editor parity.
    integrity:
      publicDigest: sha256:draft-editor-templ
    conformanceRefs:
      - editor-document-lifetime
  - id: editor-editory-svelte
    kind: adapter
    version: 0.0.0-draft
    contract: editor@0
    provides:
      - editor
    readiness: draft
    source:
      kind: npm
      package: "@ui8kit/editory-svelte"
      ref: 0.0.0-draft
      path: ../artifacts/editor-editory-svelte
      portable: false
    ownedFiles:
      - editor/surface.txt
      - compose/editor.go
    notes: EditorY Svelte is the intended host. Until a verified package is pinned, the surface uses the editor@0 buffer.
    integrity:
      publicDigest: sha256:draft-editory
    conformanceRefs:
      - editor-document-lifetime
  - id: editor-editory-solid
    kind: adapter
    version: 0.0.0-draft
    contract: editor@0
    provides:
      - editor
    readiness: draft
    source:
      kind: none
    npm:
      dependencies:
        "@ui8kit/editory-solid": 0.2.1
        editory: ^0.2.0
    notes: Editor document buffer is github.com/fastygo/modules/editor. Screen is ui8kit editor widget.
    integrity:
      publicDigest: sha256:draft-editor-editory-solid
    conformanceRefs:
      - editor-document-lifetime
  - id: editor-textarea-solid
    kind: adapter
    version: 0.0.0-draft
    contract: editor@0
    provides:
      - editor
    readiness: draft
    source:
      kind: none
    notes: Superseded by the ui8kit editor widget. No owned textarea files.
    integrity:
      publicDigest: sha256:draft-editor-textarea-solid
    conformanceRefs:
      - editor-document-lifetime
  - id: editor-textarea-svelte
    kind: adapter
    version: 0.0.0-draft
    contract: editor@0
    provides:
      - editor
    readiness: draft
    source:
      kind: local
      path: ../artifacts/editor-textarea-svelte
      portable: false
    ownedFiles:
      - editor/surface.txt
      - compose/editor.go
    notes: Honest textarea document adapter for Svelte IDE products. Does not claim CodeMirror/EditorY parity (@ui8kit/editory-svelte 404).
    integrity:
      publicDigest: sha256:draft-editor-textarea-svelte
    conformanceRefs:
      - editor-document-lifetime
  - id: terminal-host-go
    kind: adapter
    version: 0.0.0-draft
    contract: terminal@0
    provides:
      - terminal
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/terminal
      module: github.com/fastygo/modules/terminal
      portable: true
    go:
      module: github.com/fastygo/modules/terminal
      require: v0.0.0
      replace: local
    notes: Staged from ide/.modules/terminal. Memory on non-Windows. ConPTY on Windows.
    conformanceRefs:
      - terminal-session-lifecycle
  - id: terminal-memory-go
    kind: adapter
    version: 0.0.0-draft
    contract: terminal@0
    provides:
      - terminal
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/terminal
      module: github.com/fastygo/modules/terminal
      portable: true
    go:
      module: github.com/fastygo/modules/terminal
      require: v0.0.0
      replace: local
    notes: Same module as terminal-host-go. Kept as an id so existing manifests resolve without artifact copies.
    conformanceRefs:
      - terminal-session-lifecycle
  - id: terminal-windows-pty
    kind: adapter
    version: 0.0.0-draft
    contract: terminal@0
    provides:
      - terminal
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildytech/ide.git
      commit: 85082e7c93742ff0e5fed8ff9151bc4a1f4c552c
      subpath: .modules/terminal
      module: github.com/fastygo/modules/terminal
      portable: true
    go:
      module: github.com/fastygo/modules/terminal
      require: v0.0.0
      replace: local
    notes: Same module as terminal-host-go. Windows ConPTY is inside the module, not a second artifact.
    conformanceRefs:
      - terminal-session-lifecycle
  - id: browse-webview2-windows
    kind: adapter
    version: 0.0.0-draft
    contract: browse@0
    provides:
      - browse
    readiness: draft
    conflicts:
      - webview2-browser
    source:
      kind: local
      path: ../artifacts/browse-webview2-windows
      repository: https://github.com/buildy-ui/ide.git
      commit: fda6faf8d6493aa1bd82d4083b1de8a565da32a3
      portable: false
    ownedFiles:
      - browse/surface.txt
      - compose/browse.go
      - internal/browse/hub.go
      - internal/browse/hub_test.go
    integrity:
      publicDigest: sha256:draft-browse
    conformanceRefs:
      - browse-session-dispose
    compatibility:
      platforms:
        - windows
  - id: webview2-browser
    kind: capability
    version: "0"
    contract: browse@0
    readiness: draft
    notes: Alias used by product constraints for the native browser adapter family.
  - id: agent-event-contract
    kind: adapter
    version: 0.0.0-draft
    contract: agent@0
    readiness: draft
    source:
      kind: local
      path: ../artifacts/agent-event-contract
      repository: https://github.com/buildy-ui/ide.git
      commit: fda6faf8d6493aa1bd82d4083b1de8a565da32a3
      portable: false
    ownedFiles:
      - agent/contract.txt
      - .cursor/rules/agent.mdc
      - packages/agent-contract/index.ts
    integrity:
      publicDigest: sha256:draft-agent-contract
  - id: agent-runtime-cursor-node
    kind: adapter
    version: 0.0.0-draft
    contract: agent@0
    provides:
      - agent
    readiness: blocked
    dependencies:
      - agent-event-contract
    source:
      kind: local
      path: ../artifacts/agent-runtime-cursor-node
      repository: https://github.com/buildy-ui/ide.git
      commit: fda6faf8d6493aa1bd82d4083b1de8a565da32a3
      portable: false
    ownedFiles:
      - agent/runtime.txt
      - compose/agent.go
    notes: Event contract exists; Node @cursor/sdk sidecar + Go agentipc supervisor are NOT in ide/ and are not extracted. AgentService stays fail-closed (ready:false).
    integrity:
      publicDigest: sha256:draft-agent-runtime
    conformanceRefs:
      - agent-event-stream
  - id: workshop-shell-templ
    kind: vertical-slice
    version: 0.0.0-draft
    readiness: draft
    requires:
      - host
