      - src/App.svelte
    removal:
      ownedFiles:
        - slices/workshop-shell-svelte.txt
        - src/App.svelte
    notes: Full IDE chrome shell (Files | Editor+Terminal | Agent) for Svelte products. Mirrors workshop-shell-solid shape.
    integrity:
      publicDigest: sha256:draft-workshop-shell-svelte
  - id: workshop-shell-solid
    kind: vertical-slice
    version: 0.0.0-draft
    readiness: draft
    requires:
