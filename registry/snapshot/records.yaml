schemaVersion: fw.buildy.tech/registry/v0alpha1
kind: Registry
metadata:
  id: vsa-draft-records
  status: draft
records:
  - id: host
    kind: capability
    version: "0"
    contract: host@0
    readiness: draft
    conformanceRefs:
      - host-lifecycle
  - id: desktop-presentation
    kind: capability
    version: "0"
    contract: desktop-presentation@0
    readiness: draft
    conformanceRefs:
      - desktop-presentation-boundary
  - id: ui
    kind: capability
    version: "0"
    contract: ui@0
    readiness: draft
    conformanceRefs:
      - selected-ui-runtime
  - id: workspace
    kind: capability
    version: "0"
    contract: workspace@0
    readiness: draft
    conformanceRefs:
      - workspace-revision-write
  - id: userstore
    kind: capability
    version: "0"
    contract: userstore@0
    readiness: draft
    conformanceRefs:
      - userstore-session-lifetime
  - id: editor
    kind: capability
    version: "0"
    contract: editor@0
    readiness: draft
    conformanceRefs:
      - editor-document-lifetime
  - id: explorer
    kind: capability
    version: "0"
    contract: explorer@0
    readiness: draft
    conformanceRefs:
      - explorer-open-intent
  - id: vcs
    kind: capability
    version: "0"
    contract: vcs@0
    readiness: draft
    conformanceRefs:
      - vcs-status-and-failures
  - id: agent
    kind: capability
    version: "0"
    contract: agent@0
    readiness: draft
    conformanceRefs:
      - agent-event-stream
  - id: browse
    kind: capability
    version: "0"
    contract: browse@0
    readiness: draft
    conformanceRefs:
      - browse-session-dispose
  - id: delivery
    kind: capability
    version: "0"
    contract: delivery@0
    readiness: draft
    conformanceRefs:
      - portable-delivery
  - id: languages
    kind: capability
    version: "0"
    contract: languages@0
    readiness: draft
    conformanceRefs:
      - language-document-operations
  - id: terminal
    kind: capability
    version: "0"
    contract: terminal@0
    readiness: draft
    conformanceRefs:
      - terminal-session-lifecycle
  - id: templ
    kind: capability
    version: "0"
    contract: ui@0
    readiness: draft
  - id: svelte
    kind: capability
    version: "0"
    contract: ui@0
    readiness: draft
  - id: solid-js
    kind: capability
    version: "0"
    contract: ui@0
    readiness: draft
  - id: host-wails3-go
    kind: adapter
    version: 0.0.0-draft
    contract: host@0
    provides:
      - host
    features:
      - wails3
    dependencies:
      - product-template-desktop
    readiness: draft
    notes: >-
      HostService PickFolder/PickFile/PickSave/SaveFileAs/OpenPickedFile/Exit + native menus
      emitting ide:command / ide:save / ide:save-as for listenHost. No WebView2 on Linux.
    source:
      kind: local
      path: ../artifacts/host-wails3-go
      repository: https://github.com/buildy-ui/ide.git
      commit: fda6faf8d6493aa1bd82d4083b1de8a565da32a3
      portable: false
    integrity:
      publicDigest: sha256:draft-host
      outputDigest: sha256:draft-host-out
    ownedFiles:
      - host/surface.txt
      - compose/host.go
      - frontend/bindings/README.md
    go:
      module: github.com/wailsapp/wails/v3
      require: v3.0.0-beta.19
    compatibility:
      platforms:
        - windows
      runtimes:
        - go
    conformanceRefs:
      - host-lifecycle
  - id: delivery-portable-windows
    kind: delivery
    version: 0.0.0-draft
    contract: delivery@0
    provides:
      - delivery
    readiness: draft
    source:
      kind: git
      repository: https://github.com/buildy-ui/ide.git
      commit: cd2734d9ce0ea0bc5c9da59d023f148875415114
      exports:
        packages/go/portable/platform/paths.go: packages/go/portable/platform/paths.go
        packages/go/portable/platform/paths_test.go: packages/go/portable/platform/paths_test.go
      portable: false
    ownedFiles:
      - packages/go/portable/platform/paths.go
      - packages/go/portable/platform/paths_test.go
    integrity:
      publicDigest: sha256:draft-delivery
    conformanceRefs:
      - portable-delivery
    compatibility:
      platforms:
        - windows
  - id: workspace-fs-go
    kind: adapter
    version: 0.0.0-draft
    contract: workspace@0
    provides:
      - workspace
    readiness: draft
    source:
      kind: local
      path: ../artifacts/workspace-fs-go
      repository: https://github.com/buildy-ui/ide.git
      commit: cd2734d9ce0ea0bc5c9da59d023f148875415114
      portable: false
    ownedFiles:
      - workspace/surface.txt
      - compose/workspace.go
      - internal/workspace/root.go
      - internal/workspace/files.go
      - internal/workspace/tree.go
      - internal/workspace/search.go
      - internal/workspace/root_test.go
      - internal/workspace/tree_test.go
      - internal/workspace/search_test.go
      - internal/workspace/file_safety_test.go
      - internal/workspace/testdata/broken.ts
    notes: >-
      Extracted from ide/packages/go/workspace into internal/workspace (OUT module path).
      Compose WorkspaceService exposes open/tree/read/write/create/rename/trash/restore/reveal/search.
      Solid UI uses WorkspaceService via src/lib/host.ts when native host is present; preview-session is Vite fallback.
    integrity:
      publicDigest: sha256:draft-workspace
    conformanceRefs:
      - workspace-revision-write
  - id: explorer-workspace-tree
    kind: adapter
    version: 0.0.0-draft
    contract: explorer@0
    provides:
      - explorer
    requires:
      - workspace
    readiness: draft
    source:
      kind: local
      path: ../artifacts/explorer-workspace-tree
      repository: https://github.com/buildy-ui/ide.git
      commit: fda6faf8d6493aa1bd82d4083b1de8a565da32a3
      portable: false
    ownedFiles:
      - explorer/surface.txt
      - compose/explorer.go
    notes: >-
      Tree() delegates to workspace.ListTree via AttachedRoot (recursive, skip-aware).
    integrity:
      publicDigest: sha256:draft-explorer
    conformanceRefs:
      - explorer-open-intent
  - id: vcs-git-cli
    kind: adapter
    version: 0.0.0-draft
    contract: vcs@0
    provides:
      - vcs
    readiness: draft
    source:
      kind: local
      path: ../artifacts/vcs-git-cli
      repository: https://github.com/buildy-ui/ide.git
      commit: cd2734d9ce0ea0bc5c9da59d023f148875415114
      portable: false
    ownedFiles:
      - vcs/surface.txt
      - compose/vcs.go
      - internal/vcs/git.go
      - internal/vcs/git_test.go
      - packages/go/process/process_other.go
      - packages/go/process/process_windows.go
    notes: >-
      Extracted from ide/packages/go/vcs (import rewritten to example.com/app/packages/go/process).
      Compose VCSService Status/Stage/Unstage/Commit/Push/Fetch/Pull/Diff against AttachedRoot.
    integrity:
      publicDigest: sha256:draft-vcs
    conformanceRefs:
      - vcs-status-and-failures
  - id: ui-ui8kit-templ
    kind: adapter
    version: 0.0.0-draft
    contract: ui@0
    provides:
      - ui
      - templ
    readiness: draft
    source:
      kind: generated
      path: ../artifacts/ui-ui8kit-templ
      portable: false
    compatibility:
      runtimes:
        - templ
    ownedFiles:
      - ui/runtime.txt
      - frontend/dist/index.html
      - frontend/app.templ
    integrity:
      publicDigest: sha256:draft-ui-templ
    conformanceRefs:
      - selected-ui-runtime
    dependencies:
      - ui8kit-codegen
  - id: ui-ui8kit-svelte
    kind: adapter
    version: 0.0.0-draft
    contract: ui@0
    provides:
      - ui
      - svelte
    features:
      - svelte5
    readiness: draft
    source:
      kind: local
      path: ../artifacts/ui-ui8kit-svelte
      portable: false
    compatibility:
      runtimes:
        - svelte
    ownedFiles:
      - ui/runtime.txt
      - index.html
      - vite.config.ts
      - svelte.config.js
      - tsconfig.json
      - src/main.ts
      - src/app.css
      - packages/ui8kit-svelte/generated/ui/badge/Badge.svelte
      - packages/ui8kit-svelte/generated/ui/badge/badge.shared.ts
      - packages/ui8kit-svelte/generated/ui/badge/badge.variants.json
      - packages/ui8kit-svelte/generated/ui/button/Button.svelte
      - packages/ui8kit-svelte/generated/ui/button/button.shared.ts
      - packages/ui8kit-svelte/generated/ui/button/button.variants.json
      - packages/ui8kit-svelte/generated/ui/index.svelte.ts
      - packages/ui8kit-svelte/generated/ui/separator/Separator.svelte
      - packages/ui8kit-svelte/generated/ui/separator/separator.shared.ts
      - packages/ui8kit-svelte/generated/ui/separator/separator.variants.json
      - packages/ui8kit-svelte/generated/ui/text/Text.svelte
      - packages/ui8kit-svelte/generated/ui/text/text.shared.ts
      - packages/ui8kit-svelte/generated/ui/text/text.variants.json
      - packages/ui8kit-svelte/generated/utils/cn.ts
      - packages/ui8kit-svelte/generated/utils/env.ts
      - packages/ui8kit-svelte/generated/utils/expr.ts
      - packages/ui8kit-svelte/generated/utils/index.ts
      - packages/ui8kit-svelte/generated/utils/recipe-types.ts
      - packages/ui8kit-svelte/generated/utils/tags.ts
      - packages/ui8kit-svelte/generated/utils/variants.ts
    npm:
      dependencies:
        svelte: 5.19.10
        "@wailsio/runtime": 3.0.0-beta.19
        clsx: 2.1.1
        tailwind-merge: 2.6.0
      devDependencies:
        vite: 6.3.1
        "@sveltejs/vite-plugin-svelte": 5.0.3
        typescript: 5.7.3
      scripts:
        dev: vite
        build: vite build
    notes: Vite+Svelte5 shell with owned UI8Kit codegen Svelte brick subset under packages/ui8kit-svelte/generated. npm
      @ui8kit/codegen is 404 — bricks are vendored locally.
    integrity:
      publicDigest: sha256:draft-ui-svelte
    conformanceRefs:
      - selected-ui-runtime
    dependencies:
      - ui8kit-codegen
