    source:
      kind: files
      path: ../artifacts/workshop-shell-templ
      portable: false
    ownedFiles:
      - slices/workshop-shell-templ.txt
      - views/app.templ
    removal:
      ownedFiles:
        - slices/workshop-shell-templ.txt
        - views/app.templ
    integrity:
      publicDigest: sha256:draft-workshop-shell-templ
  - id: workshop-shell-svelte
    kind: vertical-slice
    version: 0.0.0-draft
    readiness: draft
    requires:
      - host
