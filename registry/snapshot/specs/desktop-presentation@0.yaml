id: desktop-presentation
contract: desktop-presentation@0
kind: capability
obligations:
  dtos:
    - frontend-safe command and query payloads
    - frontend-safe presentation event envelope
    - stable classified error payload
    - short-lived selected-workspace session state
  operations:
    - route declared presentation commands and queries
    - publish presentation events
    - expose only frontend-safe state to a transport
  invariants:
    - frontend DTOs never contain host paths, secrets, raw process handles, or vendor client types
    - a transport maps operations without changing their meaning
    - the presentation layer depends on application ports, not concrete UI or host runtimes
    - errors are classified before transport serialization
  nonObligations:
    - does not prescribe a frontend framework, desktop host, or wire protocol
    - does not own business-domain use cases or concrete adapters
    - does not promise remote access or multi-user sessions
  conformance:
    - desktop-presentation-boundary
readiness: draft
