id: languages
contract: languages@0
kind: capability
obligations:
  dtos:
    - language availability and reason
    - workspace-relative document position
    - language result location and text
    - diagnostic collection
  operations:
    - report support for a workspace-relative document
    - format document text
    - provide definitions, hover information, completions, and diagnostics
  events:
    - diagnostics may be published after document analysis
  invariants:
    - document paths resolve through the selected workspace
    - unavailable language support is explicit
    - adapters do not mutate a document unless format output is explicitly applied
  nonObligations:
    - does not require a language server protocol implementation
    - does not prescribe supported languages, tools, or process topology
    - does not include project task execution
  conformance:
    - language-document-operations
readiness: draft
