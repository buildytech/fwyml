id: ui
contract: ui@0
kind: capability
obligations:
  dtos:
    - selected runtime id
    - generated primitive ownership map
  operations:
    - resolve one runtime
    - name generated hosts the product may import
  events:
    - none required
  invariants:
    - a product resolves exactly one UI runtime
    - unselected runtimes are physically absent
  nonObligations:
    - does not require a framework
    - does not ship primitives
    - does not name kit vendors
  conformance:
    - selected-ui-runtime
readiness: draft
