id: editor
contract: editor@0
kind: capability
obligations:
  dtos:
    - document identity
    - buffer value
    - selection range
  operations:
    - open, update, and close a document
    - report selection
  events:
    - value changed
    - selection changed
    - document closed
  invariants:
    - the buffer value is the document of record for the adapter
  nonObligations:
    - does not promise CodeMirror
    - does not promise visual Markdown
    - a textarea adapter must not claim richer editor parity
  conformance:
    - editor-document-lifetime
readiness: draft
