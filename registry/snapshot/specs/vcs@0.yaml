id: vcs
contract: vcs@0
kind: capability
obligations:
  dtos:
    - status entry
    - diff hunk
    - commit request
  operations:
    - status, diff, stage, commit
    - fetch, pull, push
  events:
    - status changed
    - remote operation failed
  invariants:
    - remote failures are explicit and do not mutate the working tree silently
  nonObligations:
    - does not require Git specifically, though a Git CLI adapter may
    - does not include hosting-provider APIs
  conformance:
    - vcs-status-and-failures
readiness: draft
