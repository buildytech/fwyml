impact:
  contractVersion: initial-draft
  fw:
    - correct ownership so the CLI belongs only to fwyml
    - define registry kinds beyond capabilities
    - define composition and exclusion semantics for vertical slices
    - define guidance and external validator records
    - define local and immutable artifact provenance
  registry:
    - register local draft records for extracted/generated artifacts
    - preserve source refs and public contract digests
  fwyml:
    - add an executable bin
    - load explicit file registries and bundled snapshots
    - resolve dependencies, conflicts, and exclusions
    - materialize npm, Go, generated, copied, and rule-pack artifacts
    - emit lock, context pack, CI hints, and absence checks
  migrations: []

blockers:
  - id: FW-OWNERSHIP
    detail: Resolved in planning docs; FW no longer assigns materializer commands to an fw executable
    status: resolved
  - id: FY-EMPTY
    detail: fwyml now has a bin, schemas, resolver, and snapshot; products are still draft stubs
    status: open
  - id: HOST-COUPLED
    detail: Wails host, menu, services, and product identity are not extracted
  - id: BROWSE-INTERNAL
    detail: browser implementation is under a Go internal package and cannot be imported by a new product
  - id: SVELTE-KIT-LOCAL
    detail: ContentlY Svelte primitives are generated in the product tree, not released as a selected package
  - id: TEMPL-SHELL
    detail: generated Templ primitives exist, but no Wails 3 Templ application shell or interaction contract is proven
  - id: TEMPL-EDITOR
    detail: a full code editor is browser-side; pure Go Templ does not currently provide a CodeMirror-equivalent adapter
  - id: AGENT-RUNTIME
    detail: the event contract and chat surface exist, but IDE BuildY does not ship the planned agent sidecar
  - id: CHAT-SLICE
    detail: chat UI and product session state are not extracted as a reusable slice
  - id: BROWSER-SLICE
    detail: native browser backend and Solid presentation glue are coupled to IDE paths and bindings

decision:
  status: planned
  nonGoals:
    - feature flags inside one reference IDE
    - copying all UI runtimes into a user product
    - reimplementing ui8kit, ui8px, Retag, Wails, Templ, Svelte, or Solid in fwyml
    - claiming remote freshness without an explicit registry refresh

