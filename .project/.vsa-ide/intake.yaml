scope:
  requested: materialize three physically distinct Wails 3 products through npx fwyml
  surfaces:
    - FW contracts and registry
    - fwyml CLI
    - local artifact staging
    - Wails 3 composition
    - Templ, Svelte, and Solid UI runtimes
    - agent chat
    - native WebView2 browser
    - validators and agent guidance
  excluded:
    - rewriting source products
    - publishing packages
    - implementing the dashboard
    - pretending unfinished agent or Templ integrations are ready

