schemaVersion: fw.buildy.tech/v0alpha1
kind: Product

metadata:
  name: workshop-templ
  description: Wails 3 code workshop without agent chat, authored with Go Templ

registries:
  - id: local-vsa
    source: ${FWYML_VSA_REGISTRY}

composition:
  capabilities:
    host:
      use: host-wails3-go
    ui:
      use: ui-ui8kit-templ
    workspace:
      use: workspace-fs-go
    editor:
      use: editor-templ
    explorer:
      use: explorer-workspace-tree
    vcs:
      use: vcs-git-cli
    browse:
      use: browse-webview2-windows
    delivery:
      use: delivery-portable-windows
  slices:
    - workshop-shell
    - editor-surface
    - explorer-surface
    - browser-surface

quality:
  guidance:
    - wails3-go
    - ui8kit-templ
    - ui8px
    - retag
    - accessibility
  validators:
    - go-test
    - go-vet
    - templ-generate
    - wails-bindings
    - ui8px
    - retag
    - aria
    - wails-build

constraints:
  required:
    - windows
    - wails3
    - go
    - templ
  forbidden:
    - agent
    - agent-chat-surface
    - solid-js
    - svelte

