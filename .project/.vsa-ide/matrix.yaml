schemaVersion: "0.1"
kind: vsa-composition-matrix

legend:
  ready: source behavior exists and has tests
  extract: behavior exists but is coupled to a source product
  generate: produced by an existing generator
  design: contract or reusable slice is not yet proven
  blocked: required implementation does not exist

products:
  workshop-templ:
    manifest: manifests/workshop-templ.yaml
    uiRuntime: templ
    capabilities:
      host: extract
      ui: generate
      workspace: extract
      editor: blocked
      explorer: extract
      vcs: extract
      browse: extract
      delivery: extract
    slices:
      workshop-shell-templ: design
      editor-surface-templ: design
      explorer-surface-templ: design
      browser-surface-templ: design
    absent:
      - agent
      - agent-chat-surface
      - svelte
      - solid
    validators:
      - go-test
      - go-vet
      - templ-generate
      - wails-bindings
      - wails-build
      - ui8px
      - retag
      - aria
    blockingDecision: templ-editor-boundary

  workshop-svelte-agent:
    manifest: manifests/workshop-svelte-agent.yaml
    uiRuntime: svelte
    capabilities:
      host: extract
      ui: generate
      workspace: extract
      editor: ready
      explorer: extract
      vcs: extract
      agent: blocked
      delivery: extract
    slices:
      workshop-shell-svelte: design
      editor-surface-svelte: design
      explorer-surface-svelte: design
      agent-chat-surface-svelte: design
    absent:
      - browse
      - webview2-browser
      - solid
      - templ
    validators:
      - go-test
      - go-vet
      - svelte-check
      - wails-bindings
      - wails-build
      - ui8px
      - retag
      - aria
    blockers:
      - agent-runtime-cursor-node
      - reusable-agent-chat-surface

  assistant-solid-browser:
    manifest: manifests/assistant-solid-browser.yaml
    uiRuntime: solid
    capabilities:
      host: extract
      ui: ready
      agent: blocked
      browse: extract
      delivery: extract
    slices:
      agent-chat-surface-solid: design
      browser-surface-solid: design
    absent:
      - workspace
      - editor
      - explorer
      - vcs
      - languages
      - terminal
      - svelte
      - templ
    validators:
      - go-test
      - go-vet
      - typescript-check
      - wails-bindings
      - wails-build
      - ui8px
      - retag
      - aria
    blockers:
      - agent-runtime-cursor-node
      - reusable-agent-chat-surface
      - reusable-browser-surface

sharedArtifacts:
  host-wails3-go:
    status: extract
    source: ide-buildy/main.go
  delivery-portable-windows:
    status: extract
    source: ide-buildy/internal/platform
  ui-ui8kit-templ:
    status: generate
    source: ui8kit-codegen
  ui-ui8kit-svelte:
    status: generate
    source: ui8kit-codegen
  ui-ui8kit-solid:
    status: ready
    source: ide-buildy/packages/solid
  editor-editory-svelte:
    status: ready
    source: npm:@ui8kit/editory-svelte
  agent-event-contract:
    status: extract
    source: ide-buildy/packages/agent-contract
  agent-runtime-cursor-node:
    status: blocked
    source: ide-buildy/.project/decisions/0007-agent-runtime-bridges.md
  browse-webview2-windows:
    status: extract
    source: ide-buildy/internal/browse

