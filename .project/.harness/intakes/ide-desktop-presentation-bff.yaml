schemaVersion: "0.1"
kind: product-evidence-intake

source:
  id: ide-buildy
  repository: https://github.com/buildy-ui/ide.git
  localPath: e:/_@GoWails3/@IDEBuildY
  branch: main
  commit: cd2734d9ce0ea0bc5c9da59d023f148875415114
  packageVersions:
    go: "1.25.0"
    wails: "v3.0.0-beta.19"
  workingTree: clean
  upstreamFreshness: current
  canonicalFor:
    - local desktop presentation boundary
    - Wails 3 transport evidence

scope:
  requested: >-
    Make the IDE reusable across stack and selected composition through a
    transport-independent Desktop presentation BFF, adapter boundaries, and
    BuildY FW/fwyml assembly.
  surfaces:
    - rules
    - architecture
    - manifests
    - public-contracts
    - validators
    - tests
  excluded:
    - promotion of IDE or Wails vocabulary into BuildY FW
    - a second HTTP content API
    - runtime plugin loading

evidence:
  rules:
    - e:/_@GoWails3/@IDEBuildY/AGENTS.md
  manifests:
    - e:/_@GoWails3/@IDEBuildY/go.mod
    - e:/_@GoWails3/@IDEBuildY/internal/product/profiles.json
  contracts:
    - e:/_@GoWails3/@IDEBuildY/internal/app/service.go
    - e:/_@GoWails3/@IDEBuildY/packages/go/workspace
    - e:/_@GoWails3/@IDEBuildY/packages/go/vcs
    - e:/_@GoWails3/@IDEBuildY/packages/go/browse
  validators:
    - e:/_@GoWails3/@IDEBuildY/Taskfile.yml
  tests:
    - e:/_@GoWails3/@IDEBuildY/internal/app/service_test.go
    - e:/_@GoWails3/@IDEBuildY/internal/app/session_test.go
  decisions:
    - e:/_@GoWails3/@IDEBuildY/.project/decisions/0006-go-ipc-boundary.md
    - e:/_@GoWails3/@IDEBuildY/.project/decisions/0008-portable-product-composition.md
    - e:/_@GoWails3/@IDEBuildY/.project/decisions/0009-desktop-presentation-bff.md

candidates:
  contracts:
    - capability: host@0
      classification: existing-fw-contract
      observation: host paths and native UI state remain outside the WebView
    - capability: workspace@0
      classification: existing-fw-contract
      observation: relative paths and revision-checked writes are UI-safe
    - capability: desktop-presentation@0
      classification: draft-fw-contract
      observation: frontend-safe presentation DTOs, transport-neutral routing,
        classified errors, and selected-workspace session coordination
      promotionGate: requires conformance evidence from a second desktop product
  registryRecords:
    - id: host-wails3-go
      classification: existing-adapter-record
      action: reverify after extraction
  conformanceScenarios:
    - id: desktop-presentation-boundary
      classification: draft-fw-conformance
      observation: presentation BFF dependency closure excludes Wails
  validators:
    - id: wails-bindings
      classification: existing-registry-validator
  adapters:
    - id: wails-ui-thread-dispatch
      classification: product-transport-adapter
      destination: source-product
  slices:
    - id: ide-desktop-presentation-bff
      classification: product-slice
      destination: preset-registry-after-second-product
  productOnly:
    - IDE commands, copy, workbench layout, and product acceptance
  discarded:
    - a generic RPC endpoint
    - product-specific branches in fwyml

impact:
  contractVersion: desktop-presentation@0 (draft)
  fw:
    - publish desktop-presentation@0 as draft only
    - retain draft status until a second desktop product passes the same scenario
  registry:
    - add a real desktop-presentation adapter record only after extracting its
      source and generated transport boundary
    - reverify extracted Wails host and IDE presentation slice records
    - extract workspace-fs-go from the pinned IDE repository through declared
      source exports, without an artifact copy
  fwyml:
    - materialize generated transport facade only from registry-declared outputs
    - reject absent artifact sources instead of creating placeholder files
  migrations:
    - replace runtime feature profiles with statically selected composition

verification:
  sourceCommands:
    - go test ./...
    - go vet ./...
    - bun run validate
    - bun run build
    - wails3 task verify
  fwCommands:
    - bun run validate
  fwymlCommands:
    - bun run test
  fixtureProducts:
    - workshop-templ
    - workshop-svelte-agent
    - assistant-solid-browser
  physicalAbsenceChecks:
    - unselected transport endpoints and bindings
    - unselected UI slices and package dependencies
    - unselected delivery files
  driftCases:
    - implementation
    - provenance
    - removed-capability

provenance:
  publicSurfaceDigests: {}
  artifactIntegrity: {}
  conformanceResults:
    - internal/desktop dependency closure has no Wails package
    - wails3 task verify passed on 2026-09-17

decision:
  status: active
  blockers:
    - no second completed product yet proves desktop-presentation@0
    - VSA records point to draft artifacts that are not feature-equivalent to
      IDE BuildY source packages or UI slices
    - desktop-presentation has no extracted adapter record
    - agent-runtime-cursor-node is blocked, so agent manifests cannot promote
    - generated Templ and Svelte source artifacts require their own verified
      source and generator output contract
  nonGoals:
    - rewriting the product UI during boundary extraction
    - hidden runtime capability flags in generated products
  notes:
    - Upstream main matched the pinned source commit on 2026-09-17.
